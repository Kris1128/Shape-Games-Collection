<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形状游戏乐园</title>
<style>
  :root{
    --ink:#1d3557;
    --blue:#4d96ff;
    --green:#51cf66;
    --red:#ff6b6b;
    --yellow:#ffb703;
    --shadow:#d0d7de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(135deg,#e0f7ff,#fff6e5 55%,#f3e8ff);
    color:var(--ink);
    min-height:100vh;
  }
  #topbar{
    position:sticky;top:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 16px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(10px);
  }
  .top-btn{
    border:none;border-radius:14px;padding:9px 14px;font-weight:800;cursor:pointer;
    background:white;box-shadow:0 3px 0 var(--shadow);font-size:15px;color:var(--ink);
  }
  .top-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow);}
  .stars{
    font-size:22px;font-weight:900;background:#fff3bf;padding:8px 16px;border-radius:999px;
    white-space:nowrap;
  }
  .star-pop{animation:pop .5s;}
  #app{max-width:1100px;margin:0 auto;padding:18px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadeIn .25s;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes flyIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes tlPulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.18)}
    100%{transform:scale(1.06)}
  }
  .shake{animation:shake .45s;}

  .menu-hero{text-align:center;margin:10px 0 20px;}
  .menu-hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px;}
  .menu-hero p{color:#5c6773;font-size:17px;}
  .word-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
  .word-chip{
    background:white;border-radius:999px;padding:8px 14px;font-weight:800;
    box-shadow:0 3px 0 var(--shadow);font-size:14px;
  }
  .menu-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;
  }
  .menu-card{
    border:none;background:white;border-radius:24px;padding:18px;cursor:pointer;
    text-align:left;box-shadow:0 6px 0 var(--shadow);transition:transform .15s;
    display:flex;flex-direction:column;gap:6px;color:var(--ink);
  }
  .menu-card:hover{transform:translateY(-4px);}
  .menu-emoji{font-size:38px;}
  .menu-card strong{font-size:22px;}
  .menu-card small{color:#6c757d;font-size:14px;line-height:1.4;}
  .sentence-box{
    margin-top:22px;background:#fff8d6;border-radius:20px;padding:16px 20px;
    border:3px dashed var(--yellow);
  }
  .sentence-box h3{margin:0 0 8px;}
  .sentence-box p{margin:6px 0;font-weight:700;}

  .game-wrap{
    background:white;border-radius:28px;padding:22px;
    box-shadow:0 10px 30px rgba(29,53,87,.12);
  }
  .game-head h2{margin:0 0 4px;font-size:clamp(24px,4vw,34px);}
  .game-head p{margin:0;color:#6c757d;font-size:15px;}
  .prompt-bar{
    background:#fff8d6;border:3px dashed var(--yellow);border-radius:20px;
    padding:12px;text-align:center;margin:14px 0;
  }
  .prompt-en{font-size:clamp(22px,4vw,36px);font-weight:900;color:var(--ink);line-height:1.25;}
  .prompt-cn{font-size:16px;color:#666;margin-top:4px;}
  .feedback{
    margin-top:14px;font-size:20px;font-weight:800;color:#2b8a3e;
    text-align:center;min-height:30px;
  }
  .btn{
    border:none;border-radius:16px;padding:12px 22px;font-size:18px;font-weight:900;
    cursor:pointer;background:var(--blue);color:white;box-shadow:0 5px 0 #2f6fcc;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2f6fcc;}
  .btn.secondary{background:#e9ecef;color:#333;box-shadow:0 5px 0 #c9ced6;}
  .btn.yes{background:var(--green);box-shadow:0 5px 0 #2b8a3e;}
  .btn.no{background:var(--red);box-shadow:0 5px 0 #c92a2a;}

  .detective-scene{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    background:linear-gradient(#d8f3ff,#f0fff4);
    border-radius:20px;padding:16px;min-height:300px;
  }
  .shape-card{
    border:none;background:white;border-radius:20px;padding:8px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);transition:transform .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .shape-card:hover{transform:translateY(-3px) scale(1.03);}
  .shape-card.correct{
    animation:pop .6s;
    box-shadow:0 0 0 6px #ffe066,0 0 30px #ffd43b;
  }

  /* ===== 游戏2 形状制造机 ===== */
  .maker-canvas{
    min-height:210px;border:5px dashed #b2f2bb;border-radius:24px;
    background:#f8fff9;display:flex;align-items:center;justify-content:center;
    margin:16px 0;text-align:center;padding:16px;
  }
  .g2-build{display:flex;align-items:center;justify-content:center;}
  .g2-half-slot{
    width:86px;height:166px;
    border:3px dashed #b2f2bb;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .g2-half-slot.left{border-radius:16px 0 0 16px;}
  .g2-half-slot.right{border-radius:0 16px 16px 0;margin-left:-3px;}
  .g2-half-slot.filled{border-color:transparent;background:transparent;}
  .g2-half-slot.filled svg{animation:flyIn .35s;}
  .slot-hint{font-size:26px;font-weight:900;color:#c6f0d0;}

  .shape-palette{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .frag-btn{
    border:none;background:#fff;border-radius:16px;padding:6px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  .frag-btn:hover{transform:translateY(-3px);}

  /* ===== 其它 ===== */
  .shape-btn{
    border:none;background:#fff;border-radius:18px;padding:10px 12px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;
    gap:4px;min-width:82px;font-weight:800;color:var(--ink);font-size:14px;
  }
  .shape-btn:hover{transform:translateY(-2px);}
  .shape-btn.correct{box-shadow:0 0 0 5px #ffe066;}

  .shadow-stage,.magic-stage{
    min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#fff,#e7f5ff);
    border-radius:24px;margin:14px 0;position:relative;padding:16px;
  }
  .shadow-shape{position:relative;display:flex;align-items:center;justify-content:center;}
  .yesno-row{display:flex;gap:20px;justify-content:center;margin:12px 0;}
  .choice-title{text-align:center;font-weight:900;margin-top:10px;}
  .choice-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;}

  .parking-cards{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    min-height:100px;padding:12px;background:#fff9db;border-radius:20px;
  }
  .parking-card{
    border:none;background:white;border-radius:16px;padding:6px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);
  }
  .parking-card.selected{outline:5px solid var(--blue);transform:translateY(-4px);}
  .parking-lots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;}
  .parking-lot{
    border:4px dashed #adb5bd;border-radius:20px;background:#f8f9fa;padding:10px;
    cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--ink);min-height:96px;
  }
  .parking-lot.correct{animation:pop .6s;border-color:var(--green);background:#ebfbee;}
  .lot-label{font-size:19px;font-weight:900;letter-spacing:.5px;padding:10px 4px;}
  .lot-count{
    position:absolute;top:6px;right:10px;background:var(--blue);color:white;
    border-radius:50%;width:24px;height:24px;display:flex;align-items:center;
    justify-content:center;font-size:14px;
  }

  .match-board{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .match-col{background:#f8f9fa;border-radius:20px;padding:12px;}
  .match-col h3{text-align:center;margin:4px 0 10px;}
  .match-list{display:flex;flex-direction:column;gap:10px;}
  .match-card{
    border:none;background:white;border-radius:16px;padding:8px;
    display:flex;align-items:center;gap:12px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);font-weight:900;color:var(--ink);
  }
  .match-card.selected{outline:5px solid var(--blue);}
  .match-card.matched{opacity:.45;background:#d3f9d8;box-shadow:none;}

  .magic-bag{
    font-size:110px;cursor:pointer;user-select:none;
    animation:bounce 1.2s infinite;line-height:1;
  }
  .covered-shape{position:relative;display:flex;align-items:center;justify-content:center;}
  .revealed-shape{display:flex;flex-direction:column;align-items:center;animation:pop .5s;}
  .reveal-label{font-size:28px;font-weight:900;color:var(--ink);margin-top:6px;}

  /* ===== 游戏10 形状绕口令 ===== */
  .tl-levels{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 0;
  }
  .tl-level-btn{
    border:none;border-radius:999px;padding:9px 20px;font-weight:900;cursor:pointer;
    background:#fff;box-shadow:0 4px 0 var(--shadow);font-size:15px;color:var(--ink);
    transition:transform .15s;
  }
  .tl-level-btn:hover{transform:translateY(-2px);}
  .tl-level-btn.easy.active{background:var(--green);color:#fff;box-shadow:0 4px 0 #2b8a3e;}
  .tl-level-btn.medium.active{background:var(--yellow);color:#3d2b00;box-shadow:0 4px 0 #cc8f00;}
  .tl-level-btn.hard.active{background:var(--red);color:#fff;box-shadow:0 4px 0 #c92a2a;}

  .tl-board{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    background:linear-gradient(#fff,#f0fff4);
    border-radius:20px;padding:16px;min-height:200px;
  }
  .tl-card{
    border:none;background:white;border-radius:16px;padding:6px 6px 2px;cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:transform .15s, box-shadow .15s;
    min-width:74px;
  }
  .tl-card:hover{transform:translateY(-3px);}
  .tl-word{
    font-size:12px;font-weight:800;color:#6c757d;opacity:0;
    height:16px;line-height:16px;transition:.2s;white-space:nowrap;
  }
  .tl-card.show-word .tl-word{opacity:1;color:var(--ink);}
  .tl-card.tl-active{
    animation:tlPulse .6s;
    box-shadow:0 0 0 5px #ffe066, 0 0 24px #ffd43b;
    transform:translateY(-4px);
  }
  .tl-card.tl-active .tl-word{opacity:1;color:var(--ink);}
  .tl-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;}

  .toast{
    position:fixed;left:50%;top:86px;transform:translate(-50%,-20px);
    background:var(--ink);color:white;padding:12px 22px;border-radius:999px;
    font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:999;
    white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.success{background:#2b8a3e;}
  .toast.warn{background:#e67700;}

  @media (max-width:600px){
    .parking-lots{grid-template-columns:repeat(2,1fr);}
    .match-board{grid-template-columns:1fr;}
    .detective-scene{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;}
    .game-wrap{padding:14px;border-radius:22px;}
    .btn{padding:11px 16px;font-size:16px;}
    .shape-btn{min-width:70px;padding:8px;}
    .lot-label{font-size:16px;}
    .tl-card{min-width:64px;}
    .tl-board{gap:8px;padding:10px;}
  }
</style>
</head>
<body>

<header id="topbar">
  <button id="homeBtn" class="top-btn">🏠 菜单</button>
  <div id="stars" class="stars">⭐ 0</div>
  <button id="soundBtn" class="top-btn">🔊 语音开</button>
</header>

<div id="toast" class="toast"></div>

<main id="app">
  <!-- 菜单 -->
  <section id="menu" class="screen active">
    <div class="menu-hero">
      <h1>🌈 形状游戏乐园</h1>
      <p>选一个游戏，和形状宝宝一起玩吧！</p>
      <div class="word-chips">
        <span class="word-chip">shape 形状</span>
        <span class="word-chip">circle 圆形</span>
        <span class="word-chip">square 正方形</span>
        <span class="word-chip">triangle 三角形</span>
        <span class="word-chip">rectangle 长方形</span>
        <span class="word-chip">diamond 菱形</span>
        <span class="word-chip">heart 爱心形</span>
        <span class="word-chip">star 五角星形</span>
      </div>
    </div>

    <div class="menu-grid">
      <button class="menu-card" onclick="showScreen('game1')">
        <span class="menu-emoji">🔍</span>
        <strong>1. 形状侦探</strong>
        <small>Can you find a circle?<br>点一点，找出目标形状。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game2')">
        <span class="menu-emoji">🛠️</span>
        <strong>2. 形状制造机</strong>
        <small>Can you make a circle?<br>找到两片碎片，拼成完整形状。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game3')">
        <span class="menu-emoji">🌑</span>
        <strong>3. 猜猜我是谁</strong>
        <small>Is this a triangle?<br>看影子，判断 Yes / No。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game4')">
        <span class="menu-emoji">🚗</span>
        <strong>4. 形状停车场</strong>
        <small>把形状卡片停到对应停车场。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game6')">
        <span class="menu-emoji">🧩</span>
        <strong>6. 形状影子配对</strong>
        <small>彩色形状和灰色影子配对。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game9')">
        <span class="menu-emoji">🎁</span>
        <strong>9. 魔法袋盲盒</strong>
        <small>点开盲盒，猜猜里面是什么形状。</small>
      </button>
      <button class="menu-card" onclick="showScreen('game10')">
        <span class="menu-emoji">🎤</span>
        <strong>10. 形状绕口令</strong>
        <small>Look and say!<br>看形状，快速念出它的英文名。</small>
      </button>
    </div>

    <div class="sentence-box">
      <h3>重点句型</h3>
      <p>1. Is this a triangle? Yes. / No, it’s a ...</p>
      <p>2. Can you make a circle? Yes, I can.</p>
      <p>3. Can you find a circle? Yes, I can.</p>
    </div>
  </section>

  <section id="game1" class="screen"><div id="g1-area" class="game-wrap"></div></section>
  <section id="game2" class="screen"><div id="g2-area" class="game-wrap"></div></section>
  <section id="game3" class="screen"><div id="g3-area" class="game-wrap"></div></section>
  <section id="game4" class="screen"><div id="g4-area" class="game-wrap"></div></section>
  <section id="game6" class="screen"><div id="g6-area" class="game-wrap"></div></section>
  <section id="game9" class="screen"><div id="g9-area" class="game-wrap"></div></section>
  <section id="game10" class="screen"><div id="g10-area" class="game-wrap"></div></section>
</main>

<script>
/* ================= 基础数据 ================= */
const SHAPES = [
  { id:'circle',    en:'circle',    cn:'圆形',     color:'#ff6b6b' },
  { id:'square',    en:'square',    cn:'正方形',   color:'#4d96ff' },
  { id:'triangle',  en:'triangle',  cn:'三角形',   color:'#ffb703' },
  { id:'rectangle', en:'rectangle', cn:'长方形',   color:'#2ec4b6' },
  { id:'diamond',   en:'diamond',   cn:'菱形',     color:'#9b5de5' },
  { id:'heart',     en:'heart',     cn:'爱心形',   color:'#f15bb5' },
  { id:'star',      en:'star',      cn:'五角星形', color:'#f9c74f' }
];

const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];

let stars = 0;
try { stars = Number(localStorage.getItem('shapeStars') || 0) || 0; } catch(e) {}
let soundOn = true;

/* 游戏10 状态 */
let g10List = [];
let g10Busy = false;
let g10Timers = [];
let g10Level = 'easy';

function shapeColor(shape){
  const s = SHAPES.find(x => x.id === shape);
  return s ? s.color : '#4d96ff';
}

/* 形状内部绘制内容 */
function shapeContent(shape, color, muted){
  const c = muted ? '#c9ced6' : (color || shapeColor(shape));
  const stroke = muted ? '#aeb6c2' : 'rgba(0,0,0,.18)';
  switch(shape){
    case 'circle':
      return `<circle cx="50" cy="50" r="45" fill="${c}" stroke="${stroke}" stroke-width="2"/>`;
    case 'square':
      return `<rect x="8" y="8" width="84" height="84" rx="6" fill="${c}" stroke="${stroke}" stroke-width="2"/>`;
    case 'triangle':
      return `<polygon points="50,5 95,92 5,92" fill="${c}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;
    case 'rectangle':
      return `<rect x="5" y="22" width="90" height="56" rx="6" fill="${c}" stroke="${stroke}" stroke-width="2"/>`;
    case 'diamond':
      return `<polygon points="50,4 96,50 50,96 4,50" fill="${c}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;
    case 'heart':
      return `<path d="M50 90 C8 62 4 36 24 22 C38 12 50 24 50 32 C50 24 62 12 76 22 C96 36 92 62 50 90 Z" fill="${c}" stroke="${stroke}" stroke-width="2"/>`;
    case 'star':
      return `<polygon points="50,3 61,36 96,36 68,57 78,92 50,71 22,92 32,57 4,36 39,36" fill="${c}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`;
    default:
      return '';
  }
}

function shapeSVG(shape, size = 80, color = null, extraClass = '', muted = false){
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="${extraClass}" aria-label="${shape}" role="img">${shapeContent(shape, color, muted)}</svg>`;
}

/* 只显示形状的一半：side = 'left' | 'right' */
function halfShapeSVG(shape, side, w, h, color = null){
  const vb = side === 'left' ? '0 0 50 100' : '50 0 50 100';
  return `<svg viewBox="${vb}" width="${w}" height="${h}" aria-hidden="true">${shapeContent(shape, color, false)}</svg>`;
}

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function updateStars(){
  const el = document.getElementById('stars');
  if(el) el.textContent = `⭐ ${stars}`;
}
function addStar(){
  stars++;
  try { localStorage.setItem('shapeStars', stars); } catch(e) {}
  updateStars();
  const el = document.getElementById('stars');
  if(el){
    el.classList.remove('star-pop');
    void el.offsetWidth;
    el.classList.add('star-pop');
  }
}

/* interrupt = true 时打断上一条语音；跟读模式传 false */
function speak(text, interrupt = true){
  if(!soundOn || !window.speechSynthesis) return;
  try{
    if(interrupt) window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

let toastTimer = null;
function showToast(msg, type = 'info'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 1600);
}

function showScreen(id){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  clearG10Timers();
  g10Busy = false;

  $$('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById(id);
  if(screen) screen.classList.add('active');

  if(id === 'game1') startGame1();
  else if(id === 'game2') startGame2();
  else if(id === 'game3') startGame3();
  else if(id === 'game4') startGame4();
  else if(id === 'game6') startGame6();
  else if(id === 'game9') startGame9();
  else if(id === 'game10') startGame10();

let g2Target = null;
let g2Placed = { left:false, right:false };

function startGame2(){
  g2Lock = false;
  const area = document.getElementById('g2-area');
  area.innerHTML = `

      <h2>🛠️ 形状制造机</h2>
      <p class="sub">找到正确的两片碎片，把它们拼成完整形状！</p>

      <div class="prompt-cn" id="g2-cn"></div>
    </div>
    <div class="maker-canvas">
      <div class="g2-build">
        <div class="g2-half-slot left" id="g2-slot-left"><span class="slot-hint">?</span></div>
        <div class="g2-half-slot right" id="g2-slot-right"><span class="slot-hint">?</span></div>
      </div>
    </div>
    <div class="shape-palette" id="g2-palette"></div>

    <button class="btn secondary" onclick="startGame2()">🔄 换一题</button>
  `;
  newGame2Round();
}

function newGame2Round(){
  g2Lock = false;
  g2Placed = { left:false, right:false };
  g2Target = pick(SHAPES);

  document.getElementById('g2-prompt').textContent = `Can you make a ${g2Target.en}?`;
  document.getElementById('g2-cn').textContent = `你能做出一个${g2Target.cn}吗？`;
  speak(`Can you make a ${g2Target.en}?`);

  ['left','right'].forEach(side => {
    const slot = document.getElementById('g2-slot-' + side);
    slot.classList.remove('filled');
    slot.innerHTML = '<span class="slot-hint">?</span>';
  });

  /* 生成碎片：正确两片 + 3 片干扰 */
  const pieces = [
    { shape: g2Target.id, side:'left',  correct:true },
    { shape: g2Target.id, side:'right', correct:true }
  ];
  const others = shuffle(SHAPES.filter(s => s.id !== g2Target.id));
  let i = 0;
  while(pieces.length < 5 && i < others.length){
    const o = others[i++];
    const sd = Math.random() < 0.5 ? 'left' : 'right';
    if(!pieces.find(p => p.shape === o.id && p.side === sd)){
      pieces.push({ shape:o.id, side:sd, correct:false });
    }
  }
  shuffle(pieces);

  const palette = document.getElementById('g2-palette');
  palette.innerHTML = '';
  pieces.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'frag-btn';
    btn.innerHTML = halfShapeSVG(p.shape, p.side, 46, 92, g2Target.color);
    btn.onclick = () => handleG2Piece(btn, p);
    palette.appendChild(btn);
  });

  document.getElementById('g2-feedback').textContent = '点击正确的碎片，把它拼上去。';
}

function handleG2Piece(btn, p){
  if(g2Lock) return;

  if(p.shape === g2Target.id){
    g2Placed[p.side] = true;
    btn.remove();

    const slot = document.getElementById('g2-slot-' + p.side);
    slot.classList.add('filled');
    slot.innerHTML = halfShapeSVG(p.shape, p.side, 80, 160, g2Target.color);

    addStar();
    showToast('⭐ +1  拼上一片！', 'success');
    speak('Good!');

    if(g2Placed.left && g2Placed.right){
      g2Lock = true;
      document.getElementById('g2-feedback').textContent = `Yes, I can! You made a ${g2Target.en}!`;
      speak(`Yes, I can! You made a ${g2Target.en}!`);
      showToast('🎉 Yes, I can!', 'success');
      setTimeout(() => newGame2Round(), 1700);
    }else{
      document.getElementById('g2-feedback').textContent = '很棒！再找另一片。';
    }
  }else{
    btn.classList.add('shake');
    setTimeout(() => btn.classList.remove('shake'), 500);
    document.getElementById('g2-feedback').textContent = 'Try again. 这一片不是它的哦。';
    speak('Try again.');
  }
}

    const s = pick(SHAPES);
    if(!options.find(o => o.id === s.id)) options.push(s);
  }
  shuffle(options);

  choiceArea.innerHTML = '<div class="choice-title">选择正确形状：</div>';
  const row = document.createElement('div');
  row.className = 'choice-row';

  options.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'shape-btn';
    btn.innerHTML = shapeSVG(s.id, 64) + `<span>${s.en}</span>`;
    btn.onclick = () => {
      if(g9State.done) return;
      if(s.id === g9State.actual.id){
        g9State.done = true;
        addStar();
        document.getElementById('g9-feedback').textContent = `No, it's a ${g9State.actual.en}. 答对啦！`;
        speak(`No, it's a ${g9State.actual.en}.`);
        showToast("⭐ +1  No, it's a ...", 'success');
        revealG9();
        setTimeout(() => {
          g9State.phase = 'closed';
          renderG9Closed();
        }, 1800);
      }else{
        btn.classList.add('shake');
        setTimeout(() => btn.classList.remove('shake'), 500);
        document.getElementById('g9-feedback').textContent = '再选一选。';
        speak('Try again.');
      }
    };
    row.appendChild(btn);
  });
  choiceArea.appendChild(row);
}

function revealG9(){
  const stage = document.getElementById('g9-stage');
  stage.innerHTML = `
    <div class="revealed-shape">
      ${shapeSVG(g9State.actual.id, 180)}
      <div class="reveal-label">${g9State.actual.en}</div>
    </div>
  `;
}

/* ================= 游戏10：形状绕口令（难度分级） ================= */
function clearG10Timers(){
  g10Timers.forEach(t => clearTimeout(t));
  g10Timers = [];
}

/*
  难度说明：
  - 简单 easy：5 个，5 种不同形状各 1 次（不重复）
  - 中级 medium：8 个，7 种形状各 1 次 + 随机 1 种再重复 1 次
                （只有 7 种形状，8 个无法完全做到不重复，所以只有 1 个重复）
  - 困难 hard：10 个，随机重复，每种出现 2–3 次
*/
function generateTongueList(level){
  if(level === 'easy'){
    const chosen = shuffle([...SHAPES]).slice(0, 5);
    return shuffle([...chosen]);
  }

  if(level === 'medium'){
    const all = shuffle([...SHAPES]); // 7 种形状全部用一次
    const extra = pick(all);          // 再随机重复其中 1 个
    return shuffle([...all, extra]);  // 共 8 个
  }

  /* hard：10 个，随机重复 2–3 次 */
  const chosen = shuffle([...SHAPES]);
  const useFive = Math.random() < 0.5;
  let shapes, counts;
  if(useFive){
    /* 5 种形状 × 2 次 = 10 个 */
    shapes = chosen.slice(0, 5);
    counts = [2,2,2,2,2];
  }else{
    /* 4 种形状，2+2+3+3 = 10 个 */
    shapes = chosen.slice(0, 4);
    counts = shuffle([2,2,3,3]);
  }
  const list = [];
  shapes.forEach((s, i) => {
    for(let k = 0; k < counts[i]; k++) list.push(s);
  });
  return shuffle(list);
}

const G10_LEVEL_DESC = {
  easy:   '简单：5 个形状，都不重复。看形状，大声念出英文吧！',
  medium: '中级：8 个形状，7 种各出现一次，再重复 1 个。看形状，大声念！',
  hard:   '困难：10 个形状，会重复出现，看仔细哦！'
};

function startGame10(){
  clearG10Timers();
  g10Busy = false;
  const area = document.getElementById('g10-area');
  area.innerHTML = `
    <div class="game-head">
      <h2>🎤 形状绕口令</h2>
      <p class="sub">Look and say! 看着形状，快速念出它的英文名。</p>
    </div>
    <div class="tl-levels">
      <button class="tl-level-btn easy" data-level="easy" onclick="setG10Level('easy')">🟢 简单 · 5个</button>
      <button class="tl-level-btn medium" data-level="medium" onclick="setG10Level('medium')">🟡 中级 · 8个</button>
      <button class="tl-level-btn hard" data-level="hard" onclick="setG10Level('hard')">🔴 困难 · 10个</button>
    </div>
    <div class="prompt-bar">
      <div class="prompt-en">Say it fast!</div>
      <div class="prompt-cn" id="g10-desc"></div>
    </div>
    <div class="tl-board" id="g10-board"></div>
    <div class="feedback" id="g10-feedback">准备好了吗？</div>
    <div class="tl-actions">
      <button class="btn" id="g10-follow">▶️ 跟读挑战</button>
      <button class="btn yes" id="g10-done">✅ 我念完啦</button>
      <button class="btn secondary" id="g10-new">🔄 换一题</button>
    </div>
  `;
  updateG10LevelButtons();
  newGame10Round();
}

function updateG10LevelButtons(){
  $$('#g10-area .tl-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === g10Level);
  });
  const desc = document.getElementById('g10-desc');
  if(desc) desc.textContent = G10_LEVEL_DESC[g10Level];
}

function setG10Level(level){
  if(g10Busy) return;
  if(level === g10Level){
    newGame10Round();
    return;
  }
  g10Level = level;
  updateG10LevelButtons();
  newGame10Round();
}

function newGame10Round(){
  clearG10Timers();
  g10Busy = false;
  if(window.speechSynthesis) window.speechSynthesis.cancel();

  g10List = generateTongueList(g10Level);
  const board = document.getElementById('g10-board');
  board.innerHTML = '';

  g10List.forEach((s, idx) => {
    const card = document.createElement('button');
    card.className = 'tl-card';
    card.dataset.idx = idx;
    card.innerHTML = shapeSVG(s.id, 62) + `<span class="tl-word">${s.en}</span>`;
    card.onclick = () => {
      card.classList.add('show-word');
      speak(s.en);
    };
    board.appendChild(card);
  });

  document.getElementById('g10-feedback').textContent = '看形状，大声念出英文吧！';

  document.getElementById('g10-follow').onclick = runG10Follow;
  document.getElementById('g10-done').onclick = () => {
    if(g10Busy) return;
    addStar();
    showToast('⭐ +1  太棒了！', 'success');
    speak('Great job!');
    document.getElementById('g10-feedback').textContent = 'Great job! 下一题来啦！';
    setTimeout(() => newGame10Round(), 1300);
  };
  document.getElementById('g10-new').onclick = () => newGame10Round();
}

function runG10Follow(){
  if(g10Busy) return;
  clearG10Timers();
  g10Busy = true;

  const cards = $$('#g10-board .tl-card');
  if(!cards.length){ g10Busy = false; return; }

  const feedback = document.getElementById('g10-feedback');
  feedback.textContent = '跟着一起念！';
  if(window.speechSynthesis) window.speechSynthesis.cancel();

  const step = 1150;
  cards.forEach((card, i) => {
    const t = setTimeout(() => {
      cards.forEach(c => c.classList.remove('tl-active'));
      card.classList.add('tl-active', 'show-word');
      speak(g10List[i].en, false);
    }, i * step);
    g10Timers.push(t);
  });

  const endT = setTimeout(() => {
    cards.forEach(c => c.classList.remove('tl-active'));
    g10Busy = false;
    feedback.textContent = '念得真棒！点“我念完啦”获得星星。';
    speak('Great job!', false);
  }, cards.length * step + 250);
  g10Timers.push(endT);
}
</script>
